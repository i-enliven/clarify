[project]
name = "clarify"
version = "0.1.0"
description = "Ask a question in a native dialog; get the answer as JSON on stdout."
authors = [{ name = "Andre S." }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
clarify = "clarify.cli:main"

[build-system]
requires = ["uv_build>=0.5.7"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.6",
]
